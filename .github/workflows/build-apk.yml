name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
               -O /usr/local/bin/apktool.jar
          printf '#!/bin/bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' \
               | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Inspect original APK
        run: |
          echo "=== DEX files inside APK ==="
          unzip -l attached_assets/YouTubePro_1785357223541.apk | grep -E "\.dex|classes"
          echo "=== APK size ==="
          ls -lh attached_assets/YouTubePro_1785357223541.apk

      - name: Decompile original APK
        run: |
          apktool d attached_assets/YouTubePro_1785357223541.apk -o build/decompiled -f
          echo "=== Smali folders ==="
          ls build/decompiled/
          echo "=== Total smali files ==="
          find build/decompiled/ -name "*.smali" | wc -l
          echo "=== Class list ==="
          find build/decompiled/ -name "*.smali" | sed 's|.*/smali[^/]*/||' | sed 's|\.smali$||'

      - name: Inject DexLoader into StubApp
        run: |
          STUBAPP=$(find build/decompiled/ -name "StubApp.smali" 2>/dev/null | head -1)
          if [ -z "$STUBAPP" ]; then
            echo "StubApp not in decompile — copying from apk-source"
            mkdir -p build/decompiled/smali/com/stub
            cp apk-source/YouTubePro/smali/com/stub/StubApp.smali \
               build/decompiled/smali/com/stub/StubApp.smali
            STUBAPP="build/decompiled/smali/com/stub/StubApp.smali"
          fi
          echo "StubApp at: $STUBAPP"
          python3 scripts/inject_dexloader.py "$STUBAPP"

      - name: Copy DDL smali classes
        run: |
          SMALI_DIR=$(find build/decompiled/ -maxdepth 1 -name "smali*" -type d | sort | head -1)
          echo "Target: $SMALI_DIR"
          mkdir -p "$SMALI_DIR/com/ddl"
          for f in apk-source/YouTubePro/smali/com/ddl/*.smali; do
            FNAME=$(basename "$f")
            DST="$SMALI_DIR/com/ddl/$FNAME"
            if [ ! -f "$DST" ]; then
              cp "$f" "$DST" && echo "Copied: $FNAME"
            else
              echo "Exists: $FNAME"
            fi
          done
          ls "$SMALI_DIR/com/ddl/"

      - name: Rebuild APK
        run: |
          mkdir -p output
          apktool b build/decompiled -o output/YouTubePro-mod-unsigned.apk
          ls -lh output/YouTubePro-mod-unsigned.apk

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -alias ytpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=YouTubePro,OU=Dev,O=YTPro,L=ID,S=ID,C=ID" \
            -storepass ytpro123 -keypass ytpro123 -noprompt

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          $BT/zipalign -v -p 4 \
            output/YouTubePro-mod-unsigned.apk \
            output/YouTubePro-mod-aligned.apk
          $BT/apksigner sign \
            --ks keystore.jks --ks-key-alias ytpro \
            --ks-pass pass:ytpro123 --key-pass pass:ytpro123 \
            --out output/YouTubePro-mod.apk \
            output/YouTubePro-mod-aligned.apk
          echo "=== Signed APK ==="
          ls -lh output/YouTubePro-mod.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-mod-${{ github.run_number }}
          path: output/YouTubePro-mod.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Auto-built APK from commit ${{ github.sha }}
          files: output/YouTubePro-mod.apk
          token: ${{ secrets.GITHUB_TOKEN }}
